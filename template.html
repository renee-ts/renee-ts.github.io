<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$title$</title>
  <link rel="alternate" type="application/rss+xml" title="Renee's Blog" href="/blog/feed.xml" />

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="/style.css" />

  <style>
:root {
  --text-width: 720px;
  --gutter: calc((100vw - var(--text-width)) / 2);
  --side-gap: 3rem;
  --edge: clamp(24px, 2vw, 32px);
  --sidenote-width: clamp(160px, calc(var(--gutter) - var(--side-gap) - var(--edge)), 240px);
}

.container {
  max-width: 100%;
  padding-left: var(--gutter);
}

.sidebar {
  min-width: 220px;
  flex-shrink: 0;
}

.inner {
  max-width: var(--text-width);
}
.content {
  position: relative;
  flex: 0 1 var(--text-width);
  max-width: var(--text-width);
}

.sidenote {
  position: absolute;
  right: calc(-1 * (var(--side-gap) + var(--sidenote-width)));
  width: var(--sidenote-width);
  font-size: 0.9em;
  color: var(--color-gray-1);
  line-height: 1.5;
}

.sidenote-marker {
  color: var(--color-maroon);
  font-size: 0.75em;
  vertical-align: super;
  margin-right: 2px;
}

.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: var(--color-maroon);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.15s ease-out;
  z-index: 1000;
}

.katex {
  font-size: 1.05em;
}

.footnote-ref {
  color: var(--color-maroon);
  text-decoration: none;
  font-size: 0.85em;
  padding: 0 1px;
}

.footnote-ref:hover {
  color: var(--color-gray-2);
}

#post-content .footnote p {
  font-size: 0.9em;
  color: var(--color-gray-1);
}

#post-content .footnote-back {
  text-decoration: none;
  color: var(--color-gray-2);
}

@media (max-width: 1239px) {
  .sidenote {
    display: none;
  }
}

    .post-meta {
      color: var(--color-gray-2);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .post-tags {
      color: var(--color-gray-2);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .post-tags a {
      color: var(--color-maroon);
      text-decoration: none;
    }

    .post-tags a:hover {
      color: var(--color-gray-1);
    }

    #post-content h2 {
      color: var(--color-maroon);
      margin-top: 2rem;
    }

    #post-content h3 {
      color: var(--color-gray-1);
      margin-top: 1.5rem;
    }

    #post-content p,
    #post-content li {
      line-height: 1.7;
    }

    #post-content p {
      text-indent: 1.5em;
    }

    #post-content :is(h1, h2, h3, h4, h5, h6) + p,
    #post-content :is(.definition, .proof) > p:first-child,
    #post-content :is(li, figcaption, .quote, .footnote, .sidenote) p,
    #post-content p:has(> .math.display:only-child) {
      text-indent: 0;
    }

    #post-content a {
      color: var(--color-maroon);
    }

    #post-content a:hover {
      color: var(--color-gray-2);
    }

    #post-content code {
      background: #f4f1f0;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.92em;
    }

    #post-content pre {
      background: #f4f1f0;
      padding: 1rem;
      overflow-x: auto;
      border-left: 3px solid var(--color-gray-4);
    }

    #post-content pre code {
      background: none;
      padding: 0;
    }

    #post-content blockquote {
      border-left: 3px solid var(--color-pink);
      margin-left: 0;
      padding-left: 1rem;
      color: var(--color-gray-2);
    }
    
    #TOC {
      margin-bottom: 2rem;
      padding: 0.5rem 0;
    }

    .toc-back {
      display: none;
    }

    .toc-title {
      font-variant: small-caps;
      font-weight: bold;
      color: var(--color-gray-1);
      margin-bottom: 0.5rem;
    }

    #TOC ul {
      list-style: none;
      margin: 0;
      padding-left: 0;
    }

    #TOC ul ul {
      margin: 0.2rem 0 0.4rem 0.25rem;
      padding-left: 0.75rem;
      border-left: 1px solid var(--color-gray-4);
      font-size: 0.9em;
    }

    #TOC > ul {
      counter-reset: toc -1;
    }

    #TOC ul ul {
      counter-reset: toc;
    }

    #TOC li {
      counter-increment: toc;
    }

    #TOC li > a::before {
      content: counters(toc, ".") "\00a0\00a0";
      color: var(--color-gray-3);
      font-weight: normal;
    }

    #TOC li {
      margin: 0.2rem 0;
    }

    #TOC > ul > li + li {
      border-top: 1px solid var(--color-gray-4);
      margin-top: 0.4rem;
      padding-top: 0.4rem;
    }

    #TOC a,
    #TOC a:visited {
      color: var(--color-gray-2);
      text-decoration: none;
    }

    #TOC a:hover {
      color: var(--color-maroon);
    }

    #TOC a.active {
      color: var(--color-gray-1);
      font-weight: bold;
    }

    @media (min-width: 1240px) {
      .inner:has(#TOC) > .back-link {
        display: none;
      }

      #TOC .toc-back {
        display: inline-block;
        margin-bottom: 1rem;
        color: var(--color-gray-2);
        font-size: 0.9rem;
        font-weight: normal;
      }

      #TOC .toc-back:hover {
        color: var(--color-maroon);
      }

      #TOC {
        position: fixed;
        top: 5rem;
        width: min(220px, calc(var(--gutter) - var(--side-gap) - var(--edge)));
        left: calc(var(--gutter) - var(--side-gap) - min(220px, calc(var(--gutter) - var(--side-gap) - var(--edge))));
        max-height: calc(100vh - 7rem);
        overflow-y: auto;
        margin: 0;
        padding: 0;
        border-left: none;
        font-size: 0.85rem;
        line-height: 1.4;
      }

      #TOC > ul > li > ul {
        display: none;
      }

      #TOC > ul > li.open > ul {
        display: block;
      }
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--color-gray-2);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--color-maroon);
    }

.definition {
  margin: 1.5em 0;
  padding-left: 1em;
}

.definition-label {
  font-variant: small-caps;
  color: var(--color-maroon);
  font-weight: bold;
}

.proof {
  margin: 1.5em 0;
  padding-left: 1em;
  border-left: 1px solid var(--color-gray-4);
  display: flow-root;
}

.proof > :first-child::before {
  content: "Proof. ";
  font-style: italic;
}

.proof > :last-child::after {
  content: "∎";
  float: right;
}

.quote {
  text-align: center;
  font-style: italic;
  color: var(--color-gray-2);
  margin: 1rem 0;
  padding: 0.5rem 0;
  border-left: 3px solid var(--color-pink);
  border-right: 3px solid var(--color-pink);
  padding-left: 1rem;
  padding-right: 1rem;
  line-height: 1.5em;
}

  </style>
</head>
<body>
<div class="progress-bar" aria-hidden="true"></div>
<div class="container">
  <div class="layout">
    <aside class="sidebar" style="margin-top: 32px; padding-top: 0px;">
      <nav>
        <a href="/index.html">About</a>
        <a href="/research.html">Research</a>
        <a href="/teaching.html">Teaching</a>
        <a href="/blog/index.html">Blog</a>
        <!-- <a href="#">Notes</a> -->
        <!-- <a href="#">Art</a> -->
      </nav>
    </aside>

    <main class="content">
      <div class="inner">
        <a class="back-link" href="/blog/index.html">← blog</a>
        <div id="post-content">
          <h1>$title$</h1>
          $if(date)$<p class="post-meta">$date$$if(readtime)$ · $readtime$$endif$</p>$endif$
          $if(tags)$<p class="post-tags">$for(tags)$<a href="/blog/tag/$tags$/index.html">$tags$</a>$sep$ · $endfor$</p>$endif$
          $if(toc)$
          $if(hide-sidebar)$
          <style>.sidebar { display: none; }</style>
          $endif$
          <nav id="TOC" role="doc-toc">
          <a class="toc-back" href="/blog/index.html">← blog</a>
          <div class="toc-title">Contents</div>
          $table-of-contents$
          </nav>
          $endif$
          $body$
        </div>
      </div>
    </main>
  </div>
</div>
<script defer src="/katex-init.js"></script>
<script defer src="/progress.js"></script>
$if(toc)$<script defer src="/toc.js"></script>$endif$
</body>
</html>
