<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$title$</title>
  <link rel="alternate" type="application/rss+xml" title="Renee's Blog" href="/blog/feed.xml" />

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="/style.css" />

  <style>
.container {
  max-width: 100%;
  padding-left: calc((100vw - 900px) / 2);
}

.sidebar {
  min-width: 220px;
  flex-shrink: 0;
}

.inner {
  max-width: 900px;
}
.content {
  position: relative;
  max-width: 900px;
}

.sidenote {
  position: absolute;
  right: -280px;
  width: 240px;
  font-size: 0.9em;
  color: var(--color-gray-1);
  font-family: Georgia, serif;
  line-height: 1.5;
}

.sidenote-marker {
  color: var(--color-maroon);
  font-size: 0.75em;
  vertical-align: super;
  margin-right: 2px;
}

    .post-meta {
      color: var(--color-gray-2);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .post-tags {
      color: var(--color-gray-2);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .post-tags a {
      color: var(--color-maroon);
      text-decoration: none;
    }

    .post-tags a:hover {
      color: var(--color-gray-1);
    }

    #post-content h2 {
      color: var(--color-maroon);
      margin-top: 2rem;
    }

    #post-content h3 {
      color: var(--color-gray-1);
      margin-top: 1.5rem;
    }

    #post-content p,
    #post-content li {
      line-height: 1.7;
    }

    #post-content a {
      color: var(--color-maroon);
    }

    #post-content a:hover {
      color: var(--color-gray-2);
    }

    #post-content code {
      background: #f4f1f0;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.92em;
    }

    #post-content pre {
      background: #f4f1f0;
      padding: 1rem;
      overflow-x: auto;
      border-left: 3px solid var(--color-gray-4);
    }

    #post-content pre code {
      background: none;
      padding: 0;
    }

    #post-content blockquote {
      border-left: 3px solid var(--color-pink);
      margin-left: 0;
      padding-left: 1rem;
      color: var(--color-gray-2);
    }
    
    #post-content {
      font-family: Georgia, serif;
    }

    #TOC {
      margin-bottom: 2rem;
      padding: 0.5rem 0;
    }

    .toc-title {
      font-variant: small-caps;
      font-weight: bold;
      color: var(--color-gray-1);
      margin-bottom: 0.5rem;
    }

    #TOC ul {
      list-style: none;
      margin: 0;
      padding-left: 0;
    }

    /* Subsections: indented, with a thin grey line separating them from
       their parent section. */
    #TOC ul ul {
      margin: 0.2rem 0 0.4rem 0.25rem;
      padding-left: 0.75rem;
      border-left: 1px solid var(--color-gray-4);
      font-size: 0.9em;
    }

    /* Numbering: sections 0, 1, 2, ...; subsections 1.1, 1.2, ... */
    #TOC > ul {
      counter-reset: toc -1;
    }

    #TOC ul ul {
      counter-reset: toc;
    }

    #TOC li {
      counter-increment: toc;
    }

    #TOC li > a::before {
      content: counters(toc, ".") "\00a0\00a0";
      color: var(--color-gray-3);
      font-weight: normal;
    }

    #TOC li {
      margin: 0.2rem 0;
    }

    /* Thin horizontal line between top-level sections. */
    #TOC > ul > li + li {
      border-top: 1px solid var(--color-gray-4);
      margin-top: 0.4rem;
      padding-top: 0.4rem;
    }

    #TOC a,
    #TOC a:visited {
      color: var(--color-gray-2);
      text-decoration: none;
    }

    #TOC a:hover {
      color: var(--color-maroon);
    }

    #TOC a.active {
      color: var(--color-gray-1);
      font-weight: bold;
    }

    /* Wide screens: pin the ToC in the left margin, beside the post.
       Content is 900px wide and centred by .container's padding-left, so
       the left gutter is G = (100vw - 900px) / 2 wide. The ToC sits
       24-32px from the screen edge on smaller wide screens and moves in
       towards the post on very wide ones; its width shrinks so it always
       leaves >= 32px before the post. Below 1400px it stays inline at the
       top of the post. */
    @media (min-width: 1400px) {
      #TOC {
        position: fixed;
        top: 5rem;
        left: max(clamp(24px, 2vw, 32px), calc((100vw - 900px) / 2 - 270px));
        width: min(220px, calc((100vw - 900px) / 2 - 64px));
        max-height: calc(100vh - 7rem);
        overflow-y: auto;
        margin: 0;
        padding: 0;
        border-left: none;
        font-size: 0.85rem;
        line-height: 1.4;
      }

      /* Subsections are collapsed until their section is clicked or
         scrolled into (toc.js adds .open). */
      #TOC > ul > li > ul {
        display: none;
      }

      #TOC > ul > li.open > ul {
        display: block;
      }
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--color-gray-2);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--color-maroon);
    }

.definition {
  margin: 1.5em 0;
  padding-left: 1em;
}

.definition-label {
  font-variant: small-caps;
  color: var(--color-maroon);
  font-weight: bold;
}
.quote {
  text-align: center;
  font-style: italic;
  color: var(--color-gray-2);
  margin: 1rem 0;
  padding: 0.5rem 0;
  border-left: 3px solid var(--color-pink);
  border-right: 3px solid var(--color-pink);
  padding-left: 1rem;
  padding-right: 1rem;
  line-height: 1.5em;
}

  </style>
</head>
<body>
<div class="container">
  <div class="layout">
    <aside class="sidebar" style="margin-top: 32px; padding-top: 0px;">
      <nav>
        <a href="/index.html">About</a>
        <a href="/research.html">Research</a>
        <a href="/teaching.html">Teaching</a>
        <a href="/blog/index.html">Blog</a>
        <!-- <a href="#">Notes</a> -->
        <!-- <a href="#">Art</a> -->
      </nav>
    </aside>

    <main class="content">
      <div class="inner">
        <a class="back-link" href="/blog/index.html">← blog</a>
        <div id="post-content">
          <h1>$title$</h1>
          $if(date)$<p class="post-meta">$date$$if(readtime)$ · $readtime$$endif$</p>$endif$
          $if(tags)$<p class="post-tags">$for(tags)$<a href="/blog/tag/$tags$/index.html">$tags$</a>$sep$ · $endfor$</p>$endif$
          $if(toc)$
          $if(hide-sidebar)$
          <style>.sidebar { display: none; }</style>
          $endif$
          <nav id="TOC" role="doc-toc">
          <div class="toc-title">Contents</div>
          $table-of-contents$
          </nav>
          $endif$
          $body$
        </div>
      </div>
    </main>
  </div>
</div>
<script defer src="/katex-init.js"></script>
$if(toc)$<script defer src="/toc.js"></script>$endif$
</body>
</html>
