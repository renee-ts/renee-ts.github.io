<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$title$</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="/style.css" />

  <style>
.container {
  max-width: 100%;
  padding-left: calc((100vw - 900px) / 2);
}

.sidebar {
  min-width: 220px;
  flex-shrink: 0;
}

.inner {
  max-width: 900px;
}
.content {
  position: relative;
  max-width: 900px;
}

.sidenote {
  position: absolute;
  right: -280px;
  width: 240px;
  font-size: 0.9em;
  color: var(--color-gray-1);
  font-family: Georgia, serif;
  line-height: 1.5;
}

.sidenote-marker {
  color: var(--color-maroon);
  font-size: 0.75em;
  vertical-align: super;
  margin-right: 2px;
}

    .post-meta {
      color: var(--color-gray-2);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    #post-content h2 {
      color: var(--color-maroon);
      margin-top: 2rem;
    }

    #post-content h3 {
      color: var(--color-gray-1);
      margin-top: 1.5rem;
    }

    #post-content p {
      line-height: 1.7;
    }

    #post-content a {
      color: var(--color-maroon);
    }

    #post-content a:hover {
      color: var(--color-gray-2);
    }

    #post-content code {
      background: #f4f1f0;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.92em;
    }

    #post-content pre {
      background: #f4f1f0;
      padding: 1rem;
      overflow-x: auto;
      border-left: 3px solid var(--color-gray-4);
    }

    #post-content pre code {
      background: none;
      padding: 0;
    }

    #post-content blockquote {
      border-left: 3px solid var(--color-pink);
      margin-left: 0;
      padding-left: 1rem;
      color: var(--color-gray-2);
    }
    
    #post-content {
      font-family: Georgia, serif;
    }

    #TOC {
      margin-bottom: 2rem;
      padding: 1rem 1.25rem;
      border-left: 3px solid var(--color-maroon);
    }

    #TOC ul {
      margin: 0;
      padding-left: 1.25rem;
    }

    #TOC li {
      margin: 0.2rem 0;
    }

    #TOC a {
      color: var(--color-maroon);
      text-decoration: none;
    }

    #TOC a:hover {
      color: var(--color-gray-2);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--color-gray-2);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--color-maroon);
    }

.definition {
  margin: 1.5em 0;
  padding-left: 1em;
}

.definition-label {
  font-variant: small-caps;
  color: var(--color-maroon);
  font-weight: bold;
}
  </style>
</head>
<body>
<div class="container">
  <div class="layout">
    <aside class="sidebar" style="margin-top: 32px; padding-top: 0px;">
      <nav>
        <a href="/index.html">About</a>
        <a href="/research.html">Research</a>
        <a href="/teaching.html">Teaching</a>
        <a href="/blog/index.html">Blog</a>
        <a href="#">Notes</a>
        <a href="#">Art</a>
      </nav>
    </aside>

    <main class="content">
      <div class="inner">
        <a class="back-link" href="/blog/index.html">← blog</a>
        <div id="post-content">
          <h1>$title$</h1>
          $if(date)$<p class="post-meta">$date$$if(readtime)$ · $readtime$$endif$</p>$endif$
          $if(toc)$
          $if(hide-sidebar)$
          <style>.sidebar { display: none; }</style>
          $endif$
          $table-of-contents$
          $endif$
          $body$
        </div>
      </div>
    </main>
  </div>
</div>
<script defer src="/katex-init.js"></script>
</body>
</html>
