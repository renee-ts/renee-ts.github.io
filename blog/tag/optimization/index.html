<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="alternate" type="application/rss+xml" title="Renee's Blog" href="/blog/feed.xml" />
  <style>
    .blog-container {
      display: flex;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .blog-main {
      flex: 1;
      min-width: 600px;
    }

    .blog-sidebar {
      width: 200px;
      flex-shrink: 0;
    }

    .tag-button {
      display: block;
      padding: 0.5rem 1rem;
      margin-bottom: 0.5rem;
      background: var(--color-gray-5);
      color: var(--color-maroon);
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .tag-button:hover {
      background: var(--color-gray-4);
    }

    .tag-count {
      font-size: 0.85em;
      color: var(--color-gray-3);
      margin-left: 0.3rem;
    }

    .post-item {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--color-gray-5);
    }

    .post-item h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.3rem;
    }

    .post-item h3 a {
      color: var(--color-maroon);
      text-decoration: none;
    }

    .post-item h3 a:hover {
      color: var(--color-gray-2);
    }

    .post-item-desc {
      color: var(--color-gray-1);
      font-size: 0.95rem;
      margin: 0.25rem 0;
    }

    .post-item-meta {
      color: var(--color-gray-2);
      font-size: 0.9rem;
      margin: 0.25rem 0;
    }

    .post-item-tags {
      color: var(--color-gray-2);
      font-size: 0.85rem;
      margin: 0.5rem 0 0 0;
    }

    .post-item-tags a {
      color: var(--color-maroon);
      text-decoration: none;
      margin-right: 1rem;
    }

    .post-item-tags a:hover {
      color: var(--color-gray-1);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--color-gray-2);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--color-maroon);
    }

    .feed-link {
      display: inline-block;
      margin-top: 1rem;
      color: var(--color-gray-2);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .feed-link:hover {
      color: var(--color-maroon);
    }

    .sidebar-header {
      font-weight: bold;
      color: var(--color-maroon);
      margin-bottom: 1rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    @media (max-width: 900px) {
      .blog-container {
        flex-direction: column;
      }
      .blog-sidebar {
        width: 100%;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .tag-button {
        display: inline-block;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
<div class="blog-container">
  <main class="blog-main">
    <a class="back-link" href="/">← back</a>
    <h1>Blog</h1>
    <article class="post-item">
      <h3><a href="/blog/posts/optimization/lagrangian_duality/ld.html">Lagrangian Duality</a></h3>
      <p class="post-item-desc">TODO one-line description</p>
      <p class="post-item-meta">2026-09-12</p>
      <p class="post-item-tags"><a href="/blog/tag/optimization/index.html">optimization</a></p>
    </article>
  </main>

  <aside class="blog-sidebar">
    <div class="sidebar-header">Tags</div>
        <a href="/blog/tag/differential-geometry/index.html" class="tag-button">differential-geometry <span class="tag-count">(3)</span></a>
        <a href="/blog/tag/gamedev/index.html" class="tag-button">gamedev <span class="tag-count">(3)</span></a>
        <a href="/blog/tag/information-geometry/index.html" class="tag-button">information-geometry <span class="tag-count">(2)</span></a>
        <a href="/blog/tag/optimization/index.html" class="tag-button">optimization <span class="tag-count">(1)</span></a>
        <a href="/blog/tag/puzzles/index.html" class="tag-button">puzzles <span class="tag-count">(1)</span></a>
        <a href="/blog/tag/topology/index.html" class="tag-button">topology <span class="tag-count">(1)</span></a>
    <a href="/blog/feed.xml" class="feed-link">RSS</a>
  </aside>
</div>
</body>
</html>
